adial-gradient(circle at 90% 100%,rgba(255,77,109,.3),transparent 50%),var(--bg)}\nh1{background:linear-gradient(120deg,#6a5cff,#ff4d6d);box-shadow:0 5px 0 rgba(0,0,0,.2)}\n.card,.pill{backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.45);box-shadow:0 4px 0 rgba(0,0,0,.15),0 10px 18px rgba(0,0,0,.12)}\n.card{border-radius:14px}.card:active{transform:translateY(3px)}\n.card.sel{box-shadow:0 0 0 3px var(--acc),0 8px 18px rgba(255,77,109,.4)}\n#qb{box-shadow:0 4px 0 #a81f3b}\ncanvas{border-radius:16px;box-shadow:0 18px 30px rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.2)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style><\/head><body><main>\n<h1>Kusina Defense: Germ Invasion<\/h1>\n<div id=\"hud\"><span class=\"pill\">\u26a1 <span id=\"en\">100<\/span><\/span><span class=\"pill\" id=\"lv\"><\/span><span class=\"pill\">\ud83e\udda0 <span id=\"kl\">0<\/span>/<span id=\"gl\">10<\/span><\/span><button id=\"qb\">\ud83d\udcd8 Quiz +75<\/button><\/div>\n<div id=\"cards\"><\/div>\n<div class=\"stage\"><canvas id=\"cv\" width=\"720\" height=\"400\"><\/canvas>\n<div class=\"ov\" id=\"start\"><h2 style=\"margin:0\">Defend the kitchen!<\/h2><p>Pick a defender, then tap a tile. Germs march in from the right. Press the Quiz button to answer a question and earn \u26a1 energy.<\/p><p>Defenders: \ud83e\uddc4 \ud83c\udf72 \ud83c\udf45 \ud83e\udd58 shoot (\ud83e\udd58 fires twice), \ud83c\udf57 blocks, \u2b50 makes energy, \ud83c\udf36\ufe0f blasts a 3-row area, \ud83c\udfac clears a row. Germs: \ud83e\udda0 \ud83e\uddeb \ud83e\udd22 \ud83e\udeb3 \ud83d\udc00 and flying \ud83e\udeb0 that hop over your walls. A correct quiz answer gives double damage for 8 seconds. Beat 3 levels, then the \ud83d\udc79 Mega Germ King!<\/p><button id=\"go\">Start cooking<\/button><\/div>\n<div class=\"ov\" id=\"qm\" hidden><p id=\"qt\" style=\"font-weight:800;font-size:19px\"><\/p><div id=\"opts\"><\/div><p id=\"why\"><\/p><button id=\"nx\" hidden>Continue<\/button><\/div>\n<div class=\"ov\" id=\"end\" hidden><h2 id=\"et\" style=\"margin:0\"><\/h2><p id=\"ed\"><\/p><button id=\"rs\">Play again<\/button><\/div><\/div>\n<div id=\"toast\"><\/div><\/main>\n<script>\nconst $=s=>document.querySelector(s),cv=$('#cv'),x=cv.getContext('2d'),S=80,C=9,R=5,W=C*S,LV=[{n:'Level 1: Braising Basics',g:10,sp:7,ms:1},{n:'Level 2: Stew Station',g:16,sp:5.5,ms:1.15},{n:'Level 3: Animation Lab',g:22,sp:4.5,ms:1.3},{n:'BOSS: Mega Germ King',g:8,sp:6,ms:1.2,boss:1}];\nconst D=[{k:'g',e:'\ud83e\uddc4',n:'Garlic Saut\u00e9',s:'dry heat',c:50,cd:4},{k:'p',e:'\u2b50',n:'Pulse Star',s:'emphasis',c:50,cd:6},{k:'w',e:'\ud83c\udf57',n:'Adobo Wall',s:'blocks',c:75,cd:12},{k:'s',e:'\ud83c\udf72',n:'Stew Pot',s:'moist heat',c:100,cd:6},{k:'t',e:'\ud83c\udf45',n:'Fly-In Tomato',s:'entrance',c:100,cd:7},{k:'b',e:'\ud83e\udd58',n:'Braise Pan',s:'twin shot',c:125,cd:8},{k:'c',e:'\ud83c\udf36\ufe0f',n:'Path Pepper',s:'area blast',c:125,cd:18},{k:'x',e:'\ud83c\udfac',n:'Exit Effect',s:'clears row',c:150,cd:25}];\nconst Q=[\n['Cooking','Which method uses both dry heat and moist heat?','Combination heat cooking',['Dry heat only','Moist heat only'],'Browning is dry heat; slow cooking in liquid is moist heat.'],\n['Cooking','In braising, how much liquid is used?','A small amount, in a covered pot',['Enough to fully cover the food','None at all'],'Braising uses larger pieces and only a little liquid.'],\n['Cooking','In stewing, the bite-sized pieces are\u2026','Mostly or fully submerged in liquid',['Cooked with no liquid','Fried until crisp'],'Stewing uses smaller pieces and plenty of liquid.'],\n['Cooking','Why is chicken browned first when cooking adobo?','Dry heat adds color and flavor',['To make it raw again','To remove the soy sauce'],'Searing builds color and flavor before simmering.'],\n['Cooking','Which Chicken Adobo step uses moist heat?','Simmering in soy sauce, vinegar and water',['Browning in hot oil','Measuring ingredients'],'Simmering in liquid is the moist heat part.'],\n['Cooking','Which dish is a stew?','Pork menudo',['Fried egg','Toasted bread'],'Menudo, beef stew and vegetable stew are stewed dishes.'],\n['Cooking','What must you check before serving cooked chicken?','That it is thoroughly cooked',['That it is cold','That it is burnt'],'Food safety: meat must be fully cooked.'],\n['Cooking','What is the first step in braising?','Season the food, then sear it',['Add all the liquid','Serve it'],'Season, sear, add a little liquid, cover and cook slowly.'],\n['Animation','Which animation makes an object appear on the slide?','Entrance',['Exit','Motion path'],'Appear, Fade and Fly In are entrance effects.'],\n['Animation','Which animation highlights an object already on the slide?','Emphasis',['Entrance','Exit'],'Pulse, Grow/Shrink and Spin are emphasis effects.'],\n['Animation','Which animation makes an object disappear?','Exit',['Entrance','Emphasis'],'Disappear and Fly Out are exit effects.'],\n['Animation','What does a motion path animation do?','Moves an object along a line or curve',['Makes text bold','Changes the slide'],'It moves the object along a chosen path.'],\n['Animation','What does the Animation Pane show?','The list and order of animations',['The slide notes','The printer settings'],'You can reorder and edit effects there.'],\n['Animation','Which start option runs right after the previous effect ends?','After Previous',['On Click','With Previous'],'On Click waits for a click; With Previous starts together.'],\n['Animation','What is a slide transition?','The effect used when moving from one slide to the next',['An effect on one picture','A font style'],'Animation affects objects; transition affects slides.'],\n['Animation','What does Delay set?','How long to wait before an effect starts',['How long the effect lasts','The slide size'],'Duration is how long the effect lasts.'],\n['Animation','How do you give one object a second animation?','Use Add Animation',['Delete the first one','Change the font'],'Add Animation keeps the existing effect.']];\nlet st=null,sel='g',last=0,deck=[],lvl=0,mx=-1,my=-1,T=0;\nconst sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nD.forEach(d=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<i>${d.e}<\/i><b>${d.n}<\/b><span>${d.s}<\/span><u>${d.c}<\/u>`;b.onclick=()=>sel=d.k;$('#cards').append(b);d.b=b});\nfunction reset(){st={en:100,pl:[],g:[],sh:[],fx:[],pt:[],cd:{},kills:0,sp:7,spawned:0,qcd:0,run:true,pause:false,buff:0,bd:0,bt:8,won:0};D.forEach(d=>st.cd[d.k]=0);$('#lv').textContent=LV[lvl].n;$('#gl').textContent=LV[lvl].boss?'\ud83d\udc79':LV[lvl].g;$('#end').hidden=true}\nfunction pad(X,Y,rw,col){x.fillStyle=col;x.beginPath();x.ellipse(X,Y,rw,rw*.35,0,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=2;x.stroke()}\nfunction burst(X,Y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.3,v=40+Math.random()*90;st.pt.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.6,c:col})}}\nfunction drawPt(){st.pt.forEach(p=>{x.globalAlpha=Math.max(0,p.t/.6);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill()});x.globalAlpha=1;if(st.buff>0){x.strokeStyle='#ffd23f';x.lineWidth=6;x.strokeRect(3,3,W-6,394)}}\nfunction bg(){const cs=getComputedStyle(document.documentElement),a=cs.getPropertyValue('--t1'),b=cs.getPropertyValue('--t2');for(let r=0;r<R;r++)for(let c=0;c<C;c++){const X=c*S,Y=r*S;x.fillStyle=(r+c)%2?a:b;x.fillRect(X,Y,S,S-10);const q=x.createLinearGradient(X,Y,X+S,Y+S);q.addColorStop(0,'rgba(255,255,255,.35)');q.addColorStop(1,'rgba(0,0,0,.18)');x.fillStyle=q;x.fillRect(X,Y,S,S-10);x.fillStyle='rgba(0,0,0,.4)';x.fillRect(X,Y+S-10,S,10);x.fillStyle='rgba(255,255,255,.3)';x.fillRect(X,Y,S,2);x.fillRect(X,Y,2,S-10)}const g=x.createLinearGradient(0,0,0,400);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(0,0,0,.18)');x.fillStyle=g;x.fillRect(0,0,W,400);if(st&&LV[lvl].boss){x.fillStyle='rgba(80,0,60,.22)';x.fillRect(0,0,W,400)}x.fillStyle='rgba(230,59,46,.4)';x.fillRect(0,0,6,400);if(st&&st.run&&!st.pause&&mx>=0){x.fillStyle='rgba(255,255,255,.25)';x.fillRect(Math.floor(mx/S)*S,Math.floor(my/S)*S,S,S)}}\ncv.onpointermove=e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*W;my=(e.clientY-r.top)/r.height*400};\nlet tt;function toast(s){$('#toast').textContent=s;clearTimeout(tt);tt=setTimeout(()=>$('#toast').textContent='',1500)}\nfunction fx(X,Y,s){st.fx.push({x:X,y:Y,t:1,s})}\ncv.onpointerdown=e=>{if(!st||!st.run||st.pause)return;const r=cv.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/r.width*C),w=Math.floor((e.clientY-r.top)/r.height*R),d=D.find(q=>q.k==sel);\nif(st.en<d.c)return toast('Not enough energy yet');if(st.cd[d.k]>0)return toast('Still recharging');\nif(d.k=='c'){st.g.forEach(g=>{if(Math.abs(g.r-w)<=1&&Math.abs(g.x+30-(c*S+40))<150)g.hp-=40});burst(c*S+40,w*S+40,'#ff5a1f',40);fx(c*S+40,w*S+30,'\ud83d\udca5 Path Pepper!')}else if(d.k=='x'){st.g.forEach(g=>{if(g.r==w)g.hp-=g.b?60:999});fx(W/2,w*S+40,'\u2728 Fade out!')}\nelse{if(st.pl.some(p=>p.r==w&&p.c==c))return toast('That tile is taken');const m=d.k=='w'?90:30;st.pl.push({k:d.k,r:w,c,hp:m,m,t:d.k=='p'?4:.5})}\nst.en-=d.c;st.cd[d.k]=d.cd};\nfunction spawn(){const L=LV[lvl],n=st.spawned++;if(L.boss&&n==4){st.g.push({e:'\ud83d\udc79',hp:200,m:200,v:7,r:2,x:W-20,sl:0,b:1});fx(W/2,200,'\u26a0\ufe0f BOSS!');return}const P=[{e:'\ud83e\udda0',hp:10,v:15},{e:'\ud83e\uddeb',hp:30,v:10},{e:'\ud83e\udd22',hp:8,v:26},{e:'\ud83e\udeb3',hp:12,v:34},{e:'\ud83d\udc00',hp:55,v:9},{e:'\ud83e\udeb0',hp:6,v:22,f:1}],t=P[Math.floor(Math.random()*Math.min(6,1+n/3+lvl))];st.g.push({...t,v:t.v*L.ms,m:t.hp,r:Math.floor(Math.random()*R),x:W,sl:0})}\nfunction upd(dt){st.en+=1.5*dt;st.qcd-=dt;D.forEach(d=>st.cd[d.k]=Math.max(0,st.cd[d.k]-dt));\nst.sp-=dt;st.buff-=dt;if(st.sp<=0&&st.spawned<LV[lvl].g){spawn();st.sp=Math.max(2.2,LV[lvl].sp-st.spawned*.15)}\nst.pl.forEach(p=>{p.t-=dt;if(p.t>0)return;if(p.k=='p'){p.t=7;st.en+=25;fx(p.c*S+40,p.r*S+15,'+25 \u26a1')}\nelse if('gstb'.includes(p.k)){if(st.g.some(g=>g.r==p.r&&g.x>p.c*S)){p.t={g:1.1,s:1.6,t:2,b:1.1}[p.k];st.sh.push({x:p.c*S+60,r:p.r,s:p.k=='s',dm:p.k=='t'?5:0});if(p.k=='b')st.sh.push({x:p.c*S+25,r:p.r,s:0,dm:0})}else p.t=.2}});\nst.sh.forEach(s=>{s.x+=260*dt;const g=st.g.find(g=>g.r==s.r&&g.hp>0&&Math.abs(g.x+30-s.x)<28);if(g){g.hp-=(s.dm||(s.s?1:2))*(st.buff>0?2:1);if(s.s&&!g.b)g.sl=2;s.d=1;burst(s.x,s.r*S+40,s.s?'#4bb7ff':'#f5c400',4)}if(s.x>W)s.d=1});st.sh=st.sh.filter(s=>!s.d);\nst.g.forEach(g=>{g.sl-=dt;const p=st.pl.find(p=>p.r==g.r&&Math.abs(p.c*S+40-(g.x+30))<38);if(g.b){st.bt-=dt;if(st.bt<=0){st.bt=8;st.g.push({e:'\ud83e\udda0',hp:10,m:10,v:15,r:(g.r+1)%R,x:g.x,sl:0});fx(g.x,g.r*S+10,'Minions!')}}if(p&&!g.f)p.hp-=(g.b?60:10)*dt;else g.x-=g.v*(g.sl>0?.4:1)*dt;if(g.x<-20)finish(false)});\nst.pl=st.pl.filter(p=>p.hp>0);st.g.forEach(g=>{if(g.hp<=0){st.kills++;if(g.b)st.bd=1;burst(g.x+30,g.r*S+40,g.b?'#ffd23f':'#7bd88f',g.b?30:10)}});st.g=st.g.filter(g=>g.hp>0);\nst.fx.forEach(f=>f.t-=dt);st.fx=st.fx.filter(f=>f.t>0);st.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});st.pt=st.pt.filter(p=>p.t>0);if(LV[lvl].boss?st.bd:st.kills>=LV[lvl].g)finish(true)}\nfunction finish(w){if(!st.run)return;st.run=false;st.won=w;$('#et').textContent=w?(lvl<3?'Level cleared! \ud83c\udf89':'You defeated the Mega Germ King! \ud83c\udfc6'):'The germs got in! \ud83e\udda0';$('#ed').textContent=w?(lvl<3?'Next up: '+LV[lvl+1].n:'You are a master of combination heat cooking and slide animation!'):'Answer quizzes for extra energy and place a \ud83c\udf57 wall in busy rows.';$('#rs').textContent=w?(lvl<3?'Next level \u25b6':'Play again'):'Try again';$('#end').hidden=false}\nfunction draw(){bg();x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=8;x.shadowOffsetY=4;\nx.textAlign='center';x.textBaseline='middle';if(!st)return;\nst.pl.forEach(p=>{const D0=D.find(d=>d.k==p.k);pad(p.c*S+40,p.r*S+66,28,'#4a5bd0');x.font='50px serif';x.fillText(D0.e,p.c*S+40,p.r*S+38+Math.sin(T*3+p.c)*2.5);if(p.hp<p.m){x.fillStyle='#e63b2e';x.fillRect(p.c*S+15,p.r*S+68,50*p.hp/p.m,5)}});\nst.g.forEach(g=>{pad(g.x+30,g.r*S+70,g.b?44:20,'rgba(0,0,0,.4)');x.font=(g.b?100:48)+'px serif';x.globalAlpha=g.sl>0?.6:1;const wy=Math.sin(T*6+g.r*2)*3-(g.f?16:0);x.fillText(g.e,g.x+30,g.r*S+44+wy);if(g.b){x.font='36px serif';x.fillText('\ud83d\udc51',g.x+30,g.r*S-4+wy)}x.globalAlpha=1;x.fillStyle='#e63b2e';const bw=g.b?90:44;x.fillRect(g.x+30-bw/2,g.r*S+(g.b?-26:8),bw*g.hp/g.m,5)});\nst.sh.forEach(s=>{x.fillStyle=s.s?'#4bb7ff':'#f5c400';x.shadowColor=x.fillStyle;x.shadowBlur=14;x.shadowOffsetY=0;x.beginPath();const rr=s.dm?11:s.s?8:6,gr=x.createRadialGradient(s.x-2,s.r*S+38,1,s.x,s.r*S+40,rr);gr.addColorStop(0,'#fff');gr.addColorStop(1,s.dm?'#ff3b30':x.fillStyle);x.fillStyle=gr;x.arc(s.x,s.r*S+40,rr,0,7);x.fill()});\nx.shadowBlur=0;x.shadowOffsetY=0;drawPt();x.font='800 18px sans-serif';st.fx.forEach(f=>{x.fillStyle='#fff';x.strokeStyle='#12332b';x.lineWidth=3;x.strokeText(f.s,f.x,f.y-(1-f.t)*30);x.fillText(f.s,f.x,f.y-(1-f.t)*30)})}\nfunction hud(){if(!st)return;$('#en').textContent=Math.floor(st.en);$('#kl').textContent=st.kills;$('#qb').disabled=!st.run||st.qcd>0;\nD.forEach(d=>{d.b.classList.toggle('sel',sel==d.k);d.b.classList.toggle('off',st.en<d.c||st.cd[d.k]>0);d.b.querySelector('u').textContent=st.cd[d.k]>0?Math.ceil(st.cd[d.k])+'s':d.c})}\nfunction tick(t){const dt=Math.min((t-last)/1000||0,.05);last=t;T=t/1000;if(st&&st.run&&!st.pause)upd(dt);draw();hud();requestAnimationFrame(tick)}\n$('#qb').onclick=()=>{if(st.qcd>0||st.pause||!st.run)return;if(!deck.length)deck=sh([...Q]);const q=deck.pop();st.pause=true;$('#qt').textContent=q[0]+': '+q[1];$('#why').textContent='';$('#nx').hidden=true;$('#opts').innerHTML='';\nsh([q[2],...q[3]]).forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{[...$('#opts').children].forEach(k=>{k.disabled=true;if(k.textContent==q[2])k.className='ok'});if(o==q[2]){st.en+=75;st.buff=8;$('#why').textContent='Correct! +75 \u26a1 and double damage for 8 seconds! '+q[4]}else{b.className='no';$('#why').textContent='Not quite. '+q[4]}$('#nx').hidden=false};$('#opts').append(b)});$('#qm').hidden=false};\n$('#nx').onclick=()=>{$('#qm').hidden=true;st.pause=false;st.qcd=12};\n$('#go').onclick=()=>{$('#start').hidden=true;reset()};$('#rs').onclick=()=>{if(st.won)lvl=lvl<3?lvl+1:0;reset()};\nrequestAnimationFrame(tick);\n<\/script><\/body><\/html>\n", "2": "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Kusina Defense<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#e6f4ee;--ink:#12332b;--panel:#c9e6da;--acc:#e63b2e;--card:#fff;--t1:#d3ecdd;--t2:#bddfcb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f2420;--ink:#e6f5ee;--panel:#17342d;--card:#1f443a;--t1:#1c4036;--t2:#18382f;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0f2420;--ink:#e6f5ee;--panel:#17342d;--card:#1f443a;--t1:#1c4036;--t2:#18382f;color-scheme:dark}\nhtml,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:\"Baloo 2\",\"Trebuchet MS\",sans-serif;font-weight:500}\nmain{max-width:760px;margin:0 auto;padding:10px}\nh1{font-size:24px;margin:0 0 8px;font-weight:800;background:linear-gradient(90deg,var(--acc),#ff9a3c);color:#fff;border-radius:12px;padding:4px 14px;text-shadow:0 2px 0 rgba(0,0,0,.25)}\n#hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}\n.pill{background:var(--panel);border-radius:20px;padding:2px 12px;font-weight:800}\nbutton{font:inherit;color:inherit;cursor:pointer}\n#qb{background:var(--acc);color:#fff;border:0;border-radius:20px;padding:3px 14px;font-weight:800}\n#qb:d yle=\"margin:0\">Defend the kitchen!<\/h2><p>Pick a defender, then tap a tile. Germs march in from the right. Press the Quiz button to answer a question and earn \u26a1 energy.<\/p><p>\ud83e\uddc4 and \ud83c\udf72 shoot, \ud83c\udf57 blocks, \u2b50 makes energy, \ud83c\udfac clears a row (60 damage to the boss). A correct quiz answer gives double damage for 8 seconds. Clear 3 levels, then beat the \ud83d\udc79 Mega Germ King!<\/p><button id=\"go\">Start cooking<\/button><\/div>\n<div class=\"ov\" id=\"qm\" hidden><p id=\"qt\" style=\"font-weight:800;font-size:19px\"><\/p><div id=\"opts\"><\/div><p id=\"why\"><\/p><button id=\"nx\" hidden>Continue<\/button><\/div>\n<div class=\"ov\" id=\"end\" hidden><h2 id=\"et\" style=\"margin:0\"><\/h2><p id=\"ed\"><\/p><button id=\"rs\">Play again<\/button><\/div><\/div>\n<div id=\"toast\"><\/div><\/main>\n<script>\nconst $=s=>document.querySelector(s),cv=$('#cv'),x=cv.getContext('2d'),S=80,C=9,R=5,W=C*S,LV=[{n:'Level 1: Braising Basics',g:10,sp:7,ms:1},{n:'Level 2: Stew Station',g:16,sp:5.5,ms:1.15},{n:'Level 3: Animation Lab',g:22,sp:4.5,ms:1.3},{n:'BOSS: Mega Germ King',g:8,sp:6,ms:1.2,boss:1}];\nconst D=[{k:'g',e:'\ud83e\uddc4',n:'Garlic Saut\u00e9',s:'dry heat',c:50,cd:4},{k:'p',e:'\u2b50',n:'Pulse Star',s:'emphasis',c:50,cd:6},{k:'w',e:'\ud83c\udf57',n:'Adobo Wall',s:'blocks',c:75,cd:12},{k:'s',e:'\ud83c\udf72',n:'Stew Pot',s:'moist heat',c:100,cd:6},{k:'x',e:'\ud83c\udfac',n:'Exit Effect',s:'clears row',c:150,cd:25}];\nconst Q=[\n['Cooking','Which method uses both dry heat and moist heat?','Combination heat cooking',['Dry heat only','Moist heat only'],'Browning is dry heat; slow cooking in liquid is moist heat.'],\n['Cooking','In braising, how much liquid is used?','A small amount, in a covered pot',['Enough to fully cover the food','None at all'],'Braising uses larger pieces and only a little liquid.'],\n['Cooking','In stewing, the bite-sized pieces are\u2026','Mostly or fully submerged in liquid',['Cooked with no liquid' ;$('#who').textContent=team?'\ud83d\udc49 '+s.teams[G.cur]:'\ud83c\udf57 Adobo Dash';syncBtn();\n showOv(`<div class=\"card2\"><div class=\"badge\">${team?'TEAM TURN':'GET READY'}<\/div><h2 style=\"margin-top:10px\">${team?esc(s.teams[G.cur])+\", you're up!\":'Ready, chef?'}<\/h2><p>\u23f1 <b>${fmt(G.turnT)}<\/b> to cook the perfect Chicken Adobo.<\/p><p class=\"hint\">Drag to move \u2022 Space / \ud83d\udd04 switches \ud83c\udf73 dry heat \u2194 \ud83c\udf72 moist heat<\/p><button class=\"btn pri big\" data-act=\"go\">\u25b6 Start<\/button><\/div>`);\n draw();hud();\n}\nconst mult=()=>Math.min(4,1+Math.floor(R.combo/3));\nfunction syncBtn(){const b=$('#sw');if(!b||!R)return;const d=R.mode==='dry';b.className='btn big '+(d?'dry':'moist');b.textContent=d?'\ud83c\udf73 Pan (dry heat) \u2014 tap to switch to Pot':'\ud83c\udf72 Pot (moist heat) \u2014 tap to switch to Pan'}\nfunction loop(now){\n if(!G||!R)return;\n const dt=Math.min(.033,(now-last)/1000);last=now;\n if(R.state==='play')update(dt);\n draw();hud();\n if(R.state==='play'||R.state==='quiz')raf=requestAnimationFrame(loop);\n}\nfunction spawn(kind){\n const ok=D.items.filter(i=>i.n),rnd=a=>a[Math.random()*a.length|0];\n const good=ok.filter(i=>i.c!=='bad'),bad=ok.filter(i=>i.c==='bad');\n let t=kind||(Math.random()<.74?'food':'bad');\n if(t==='food'&&!good.length)t='bad';if(t==='bad'&&!bad.length&&good.length)t='food';\n const it={t,x:40+Math.random()*(W-80),y:-30,vx:(Math.random()-.5)*50,vy:90};\n if(t!=='star'){const d=rnd(t==='food'?good:bad);if(!d)return;it.e=d.e;it.n=d.n;it.c=d.c}\n R.items.push(it);\n}\nfunction add(p){G.sc[G.cur]=Math.max(0,G.sc[G.cur]+p)}\nfunction fx(x,y,s,c){R.fx.push({x:Math.max(80,Math.min(W-80,x)),y,s,c,l:1})}\nfunction burst(x,y,c){for(let i=0;i<12;i++){const a=Math.random()*6.28,v=60+Math.random()*140;R.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:.6,c})}}\nfunction update(dt){\n R.t-=dt;R.el+=dt;if(R.t<=0){R.t=0;endTurn();return}\n R.x+=(R.tx-R.x)*Math.min(1,dt*14);if(R.sup>0)R.sup-=dt;\n R.spawn-=dt;if(R.spawn<=0){spawn();R.spawn=Math.max(.42,1-R.el*.004)}\n R.star-=dt;if(R.star<=0){spawn('star');R.star=12}\n const hw=(R.sup>0?95:62),fall=105+Math.min(120,R.el*1);\n for(const it of R.items){\n  if(R.state!=='play')break;\n  it.vy+=(fall-it.vy)*1.2*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;\n  if(it.x<30||it.x>W-30)it.vx*=-1;\n  if(it.y>SY-30&&it.y<SY+25&&Math.abs(it.x-R.x)<hw){\n   it.dead=1;\n   if(it.t==='star'){R.combo++;burst(it.x,it.y,'#fde047');quiz()}\n   else if(it.t==='bad'){add(-5);R.combo=0;R.shake=.3;G.wrong++;fx(it.x,SY-50,'Not in adobo! \u22125','#fca5a5');beep(180,.2)}\n   else if(it.c===R.mode){R.combo++;const p=10*mult();add(p);G.caught++;fx(it.x,SY-50,(it.c==='dry'?'\ud83d\udd25 Dry heat +':'\ud83d\udca7 Moist heat +')+p+(mult()>1?' \u00d7'+mult():''),'#86efac');burst(it.x,SY-20,CAT[it.c].col);beep(650+R.combo*25,.08)}\n   else{add(-5);R.combo=0;R.shake=.3;G.wrong++;fx(it.x,SY-50,it.n+' \u2192 '+CAT[it.c].n+'! \u22125','#fca5a5');beep(180,.2)}\n  }\n  if(it.y>H+40){it.dead=1;if(it.t==='food')R.combo=0}\n }\n R.items=R.items.filter(i=>!i.dead);\n R.fx.forEach(f=>{f.y-=40*dt;f.l-=dt*.8});R.fx=R.fx.filter(f=>f.l>0);\n R.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt});R.pt=R.pt.filter(p=>p.l>0);\n}\nfunction quiz(){\n const bank=D.qs.filter(q=>q.q.trim()&&q.o.length>1);\n if(!bank.length){add(25);R.sup=12;fx(R.x,SY-70,\"\ud83d\udc68\u200d\ud83c\udf73 +25 Chef's Boost!\",'#fde047');return}\n const q=bank[Math.random()*bank.length|0];R.qo=shuffle(q.o.map((t,i)=>({t,c:i===q.a})));R.state='quiz';R.ql=0;\n showOv(`<div class=\"card2\"><div class=\"badge\">\u2b50 CHEF'S QUESTION<\/div><h2 style=\"margin-top:10px\">${esc(q.q)}<\/h2><div class=\"opts\">${R.qo.map((x,i)=>`<button class=\"opt\" data-act=\"qa\" data-i=\"${i}\"><span>${'ABCD'[i]}<\/span>${esc(x.t)}<\/button>`).join('')}<\/div><div class=\"fb\" id=\"fb\"><\/div><\/div>`);\n}\nfunction answerQ(i){\n if(!R||R.state!=='quiz'||R.ql)return;R.ql=1;G.qn++;\n const ok=R.qo[i].c,bs=[...document.querySelectorAll('.ov .opt')];\n bs.forEach((b,k)=>{b.disabled=true;if(R.qo[k].c)b.classList.add('good')});\n if(ok){G.qok++;add(25);R.sup=12;$('#fb').textContent=\"\u2705 Correct! +25 and Chef's Boost!\";$('#fb').style.color='#16a34a';beep(880,.2)}\n else{bs[i].classList.add('bad');$('#fb').textContent='\u274c The answer is: '+R.qo.find(x=>x.c).t;$('#fb').style.color='#dc2626';beep(200,.25)}\n setTimeout(()=>{if(!G||!R||R.state!=='quiz')return;hideOv();R.state='play'},ok?900:1700);\n}\nfunction flip(){if(R&&R.state==='play'){R.mode=R.mode==='dry'?'moist':'dry';syncBtn();beep(500,.05)}}\nfunction endTurn(){\n R.state='end';cancelAnimationFrame(raf);beep(660,.35);draw();hud();\n if(G.cur<G.n-1)showOv(`<div class=\"card2\"><h2>\u23f0 Time's up!<\/h2><p><b>${esc(D.settings.teams[G.cur])}<\/b> scored <b>${G.sc[G.cur]}<\/b> points.<\/p><button class=\"btn pri big\" data-act=\"next\">Next team \u25b6<\/button><\/div>`);\n else setTimeout(results,600);\n}\nfunction hud(){\n if(!G||!R)return;const s=D.settings,m=mult();\n $('#clk').textContent=fmt(Math.max(0,Math.ceil(R.t)));$('#clk').classList.toggle('warn',R.t<=30&&R.state!=='ready');\n $('#tb').style.width=Math.max(0,R.t/G.turnT*100)+'%';\n let h=G.n>1?G.sc.map((v,i)=>`<span class=\"${i===G.cur?'act':''}\" style=\"--c:${TC[i]}\">${esc(s.teams[i])}: ${v}<\/span>`).join(''):`<span>\u2b50 ${G.sc[0]}<\/span>`;\n h+=`<span>\ud83d\udd25 Combo ${R.combo}${m>1?' \u00d7'+m:''}<\/span>`+(R.sup>0?`<span class=\"act\" style=\"--c:#eab308\">\ud83d\udc68\u200d\ud83c\udf73 Boost ${Math.ceil(R.sup)}s<\/span>`:'');\n if(h!==lastHud){$('#sb').innerHTML=h;lastHud=h}\n}\nfunction results(){\n if(!G)return;const s=D.settings;let body;\n if(G.n>1){\n  const r=G.sc.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),top=r[0].v,w=r.filter(x=>x.v===top);\n  body=`<div class=\"big\">\ud83c\udfc6<\/div><h1>${w.length>1?\"It's a tie!\":esc(s.teams[w[0].i])+' wins!'}<\/h1>`+r.map((x,k)=>`<div class=\"rank ${x.v===top?'win':''}\" style=\"--c:${TC[x.i]}\">${['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49','4\ufe0f\u20e3'][k]} ${esc(s.teams[x.i])}<em>${x.v} pts<\/em><\/div>`).join('')+`<p class=\"hint\">${G.caught} ingredients cooked right \u2022 ${G.qok}/${G.qn} chef's questions correct<\/p>`;\n }else body=`<div class=\"big\">${G.sc[0]>=300?'\ud83c\udf1f':G.sc[0]>=150?'\ud83d\udc4d':'\ud83d\udcaa'}<\/div><h1>Time's up!<\/h1><div class=\"big\" style=\"color:#ea580c\">${G.sc[0]} pts<\/div><p><b>${G.caught}<\/b> ingredients cooked right \u2022 <b>${G.wrong}<\/b> mistakes \u2022 <b>${G.qok}/${G.qn}<\/b> questions correct<\/p><p class=\"hint\">${G.sc[0]>=300?'Master chef!':'Play again to beat your score!'}<\/p>`;\n cancelAnimationFrame(raf);\n app.innerHTML=`<div class=\"res panel\">${body}<div class=\"acts\"><button class=\"btn pri big\" data-act=\"play\">\ud83d\udd01 Play Again<\/button><button class=\"btn big\" data-act=\"home\">\ud83c\udfe0 Home<\/button><\/div><\/div>`;\n R=null;\n}\n\n/* ---------- DRAWING ---------- */\nfunction rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}\nfunction draw(){\n if(!ctx||!R)return;const c=ctx,hw=R.sup>0?95:62,cat=CAT[R.mode],t=Date.now()/300;\n c.save();if(R.shake>0){R.shake-=.016;c.translate((Math.random()-.5)*10,(Math.random()-.5)*10)}\n const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7c2d12');g.addColorStop(1,'#431407');c.fillStyle=g;c.fillRect(-20,-20,W+40,H+40);\n c.fillStyle='#ffffff10';for(let x=0;x<W;x+=80)for(let y=0;y<H-70;y+=80)c.fillRect(x+1,y+1,78,78);\n c.fillStyle='#78350f';c.fillRect(0,SY+34,W,H);c.fillStyle='#a16207';c.fillRect(0,SY+34,W,6);\n R.items.forEach(it=>{\n  c.textAlign='center';c.textBaseline='middle';\n  if(it.t==='star'){c.shadowColor='#fde047';c.shadowBlur=22;c.font='44px serif';c.fillText('\u2b50',it.x,it.y);c.shadowBlur=0}\n  else{c.fillStyle='#ffffffdd';rr(it.x-34,it.y-30,68,62,12);c.fill();c.font='30px serif';c.fillStyle='#000';c.fillText(it.e,it.x,it.y-8);c.font='bold 11px sans-serif';c.fillStyle='#1e293b';c.fillText(it.n,it.x,it.y+20)}\n });\n // cookware\n if(R.sup>0){c.shadowColor='#fde047';c.shadowBlur=24}\n c.fillStyle=cat.col;rr(R.x-hw,SY-6,hw*2,40,14);c.fill();c.shadowBlur=0;\n c.fillStyle='#fff';c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(cat.n,R.x,SY+14);\n c.font='54px serif';c.fillText(cat.e,R.x,SY-24);\n c.font='22px serif';\n if(R.mode==='dry'){for(let k=-1;k<=1;k++)c.fillText('\ud83d\udd25',R.x+k*30,SY+46+Math.sin(t+k)*3)}\n else{for(let k=-1;k<=1;k++){c.globalAlpha=.7;c.fillText('\u2668\ufe0f',R.x+k*30,SY-62-Math.abs(Math.sin(t+k))*10);c.globalAlpha=1}}\n R.pt.forEach(p=>{c.globalAlpha=Math.max(0,p.l/.6);c.fillStyle=p.c;c.fillRect(p.x,p.y,5,5)});c.globalAlpha=1;\n R.fx.forEach(f=>{c.globalAlpha=Math.min(1,f.l*1.6);c.fillStyle=f.c;c.font='bold 18px sans-serif';c.textAlign='center';c.fillText(f.s,f.x,f.y)});c.globalAlpha=1;\n c.restore();\n}\n\n/* ---------- EDITOR ---------- */\nfunction editor(){\n const y=scrollY,it=E.t===0;\n const rows=it?`<p class=\"hint\">These ingredients fall during the game. Choose the cookware each one belongs to: \ud83c\udf73 Dry heat (browning/saut\u00e9ing), \ud83c\udf72 Moist heat (simmering in liquid), or \u274c Not an ingredient (a trap!).<\/p>`+D.items.map((x,i)=>`<div class=\"qe obj\"><input type=\"text\" class=\"em\" data-f=\"ie\" data-i=\"${i}\" value=\"${esc(x.e)}\" maxlength=\"4\" aria-label=\"Emoji\"><input type=\"text\" data-f=\"in\" data-i=\"${i}\" value=\"${esc(x.n)}\" aria-label=\"Name\"><select data-f=\"ic\" data-i=\"${i}\"><option value=\"dry\" ${x.c==='dry'?'selected':''}>\ud83c\udf73 Dry heat (Pan)<\/option><option value=\"moist\" ${x.c==='moist'?'selected':''}>\ud83c\udf72 Moist heat (Pot)<\/option><option value=\"bad\" ${x.c==='bad'?'selected':''}>\u274c Not an ingredient<\/option><\/select><button class=\"x\" data-act=\"deli\" data-i=\"${i}\">\ud83d\udd n using animation effectively?\",\"o\":[\"Excessive movement and distracting sounds\",\"Testing the slideshow\",\"Consistent styles\",\"Choosing effects that fit the purpose\"],\"a\":0},\n{\"q\":\"Why should you preview animations before presenting?\",\"o\":[\"To check the sequence and make sure they display correctly\",\"To delete the slides\",\"To change the file name\",\"To print the slides\"],\"a\":0}]},\n{\"id\":\"seqc\",\"type\":\"seq\",\"icon\":\"\ud83d\udd22\",\"name\":\"Cook Steps Order\",\"desc\":\"FCS: tap the steps in the right order\",\"color\":\"#0d9488\",\"fixed\":false,\"qs\":[\n{\"q\":\"Preparing Chicken Adobo\",\"s\":[\"Prepare and measure all the ingredients.\",\"Heat cooking oil in a pan and brown the chicken pieces.\",\"Add the garlic and other seasonings.\",\"Add the soy sauce, vinegar, water, bay leaves, and black pepper.\",\"Allow the ingredients to cook together so the chicken absorbs the flavors.\",\"Simmer the chicken until tender and thoroughly cooked.\",\"Present the finished Chicken Adobo and clean the cooking area.\"]},\n{\"q\":\"Steps in Braising\",\"s\":[\"Season the food.\",\"Sear or brown it in a hot pan.\",\"Add a small amount of liquid, such as broth or sauce.\",\"Cover the pan and cook slowly over low heat.\",\"Check that the food is tender and thoroughly cooked before serving.\"]},\n{\"q\":\"Steps in Stewing\",\"s\":[\"Cut the meat and vegetables into smaller pieces.\",\"Brown the meat or saut\u00e9 the ingredients if the recipe requires it.\",\"Add enough liquid to cover or mostly submerge the ingredients.\",\"Simmer slowly until the meat and vegetables become tender.\",\"Check that the food is thoroughly cooked before serving.\"]}]},\n{\"id\":\"seqp\",\"type\":\"seq\",\"icon\":\"\ud83d\uddb1\ufe0f\",\"name\":\"Slide Steps Order\",\"desc\":\"ICT: tap the PowerPoint steps in order\",\"color\":\"#c026d3\",\"fixed\":false,\"qs\":[\n{\"q\":\"Inserting Animation in PowerPoint\",\"s\":[\"Open PowerPoint and create or open a presentation.\",\"Select the slide containing the object to animate.\",\"Click the text box, picture, shape, or other object.\",\"Go to the Animations tab.\",\"Choose an animation effect, such as Appear, Fade, or Fly In.\",\"Click Preview to see how the animation works.\",\"Adjust the duration, delay, and start options when needed.\",\"Save the presentation.\"]},\n{\"q\":\"Using the Animation Pane\",\"s\":[\"Select an object on the slide.\",\"Open the Animations tab.\",\"Apply an animation effect.\",\"Click Animation Pane to display the list of effects.\",\"Select an effect to change its order or settings.\",\"Preview the slide to check the sequence.\"]}]}\n]}\n<\/script>\n<script>\nconst $=s=>document.querySelector(s),app=$('#app'),KEY='g6_tle_w8_zone_v1';\nconst BASE=JSON.parse($('#qdata').textContent);let D=BASE;\ntry{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.stamp===BASE.stamp)D=s}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};\nconst fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');\nconst TC=['#ef476f','#118ab2','#06a77d','#f59e0b'];\nlet G=null,E={d:0},ac;\nfunction beep(f,d=.12){if(!D.settings.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}\nfunction stop(){if(G&&G.tm){clearInterval(G.tm);G.tm=0}}\nfunction file(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}\nconst okq=(d,q)=>d.type==='seq'?q.q.trim()&&q.s.length>1:q.q.trim()&&q.o.length>1;\nconst cnt=d=>d.qs.filter(q=>okq(d,q)).length;\n\n/* ---------- HOME ---------- */\nfunction home(){\n stop();G=null;const s=D.settings,team=s.mode==='team';\n const card=d=>`<button class=\"deck\" style=\"--c:${d.color}\" data-act=\"play\" data-id=\"${d.id}\"><div class=\"ic\">${d.icon}<\/div><b>${esc(d.name)}<\/b><small>${esc(d.desc)}<br>${cnt(d)} ${d.type==='seq'?'puzzles':'questions'}<\/small><\/button>`;\n app.innerHTML=`<header class=\"hero\"><div class=\"badge\">GRADE 6 \u2022 TLE \u2022 TERM 2 \u2022 WEEK 8<\/div><h1>\ud83d\udc69\u200d\ud83c\udf73 TLE Game Zone \ud83d\udcbb<\/h1><p>Braising &amp; Stewing \u2022 Chicken Adobo \u2022 Slide Animation. Beat the clock!<\/p><\/header>\n <section class=\"panel\"><h2>1 \u00b7 Choose how to play<\/h2>\n <div class=\"seg\"><button data-act=\"mode\" data-v=\"solo\" class=\"${team?'':'on'}\">\ud83d\ude4b Solo Player<\/button><button data-act=\"mode\" data-v=\"team\" class=\"${team?'on':''}\">\ud83d\udc65 Team Play<\/button><\/div>\n ${team?`<div class=\"cnt\">Teams: ${[2,3,4].map(n=>`<button data-act=\"nt\" data-v=\"${n}\" class=\"${s.nTeams==n?'on':''}\">${n}<\/button>`).join('')}<\/div>\n <div class=\"teams\">${s.teams.slice(0,s.nTeams).map((t,i)=>`<input type=\"text\" data-f=\"team\" data-i=\"${i}\" value=\"${esc(t)}\" maxlength=\"20\" style=\"border-color:${TC[i]}\" aria-label=\"Team ${i+1} name\">`).join('')}<\/div>`:''}\n <div class=\"row\"><label>\u23f1 Timer (seconds)<input type=\"number\" data-f=\"time\" min=\"30\" max=\"900\" step=\"30\" value=\"${s.time}\"><\/label><label><input type=\"checkbox\" data-f=\"snd\" ${s.sound?'checked':''}> \ud83d\udd0a Sound<\/label><\/div><\/section>\n <section class=\"panel\"><h2>2 \u00b7 Pick a game<\/h2><div class=\"grid\">\n <div class=\"sub\">\ud83c\udf73 Family &amp; Consumer Science<\/div>${D.decks.filter(d=>/bs|cook|seqc/.test(d.id)).map(card).join('')}\n <div class=\"sub\">\ud83d\udcbb Information &amp; Communications Technology<\/div>${D.decks.filter(d=>/anim|ppt|seqp/.test(d.id)).map(card).join('')}\n <div class=\"sub\">\ud83c\udfb2 Everything<\/div>\n <button class=\"deck\" style=\"--c:#1e293b\" data-act=\"play\" data-id=\"mix\"><div class=\"ic\">\ud83c\udfb2<\/div><b>Mega Mix<\/b><small>All quiz games together<br>${D.decks.filter(d=>d.type==='choice').reduce((n,d)=>n+cnt(d),0)} questions<\/small><\/button><\/div><\/section>\n <div class=\"acts\"><button class=\"btn\" data-act=\"edit\">\u270f\ufe0f Edit Questions<\/button><button class=\"btn pri\" data-act=\"dl\">\u2b07\ufe0f Download Game (.html)<\/button><\/div>\n <p class=\"hint\" style=\"text-align:center\">Scoring: +10 per correct answer (+5 streak bonus when playing solo). Step puzzles: +5 per correct step, +10 for finishing. Team play: a wrong answer passes the turn.<\/p>`;\n}\n\n/* ---------- PLAY ---------- */\nfunction play(id){\n const decks=id==='mix'?D.decks.filter(d=>d.type==='choice'):D.decks.filter(d=>d.id===id);let pool=[];\n decks.forEach(d=>d.qs.forEach(q=>{if(okq(d,q))pool.push({...q,fixed:d.fixed,seq:d.type==='seq'})}));\n if(!pool.length){alert('This game has no questions yet. Add some in \u270f\ufe0f Edit Questions.');return}\n const s=D.settings,n=s.mode==='team'?s.nTeams:1;\n G={id,pool:shuffle(pool),i:0,sc:Array(n).fill(0),turn:0,streak:0,ok:0,tot:0,over:false,lock:false,endAt:Date.now()+s.time*1000};\n const title=id==='mix'?'\ud83c\udfb2 Mega Mix':decks[0].icon+' '+esc(decks[0].name);\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"quit\">\u2716 Quit<\/button><div class=\"name\">${title}<\/div><div class=\"clock\" id=\"clk\">${fmt(s.time)}<\/div><\/div><div class=\"tbar\"><i id=\"tb\"><\/i><\/div><div class=\"score\" id=\"sb\"><\/div><div id=\"qa\"><\/div>`;\n showQ();G.tm=setInterval(tick,200);beep(520,.15);\n}\nfunction tick(){\n const ms=G.endAt-Date.now(),s=Math.max(0,Math.ceil(ms/1000)),c=$('#clk');\n c.textContent=fmt(s);c.classList.toggle('warn',s<=30);$('#tb').style.width=Math.max(0,ms/(D.settings.time*10))+'%';\n if(s<=10&&s>0&&G.lb!==s){G.lb=s;beep(600,.06)}\n if(ms<=0)endGame();\n}\nfunction scoreBar(){\n const s=D.settings;\n $('#sb').innerHTML=s.mode==='team'?G.sc.map((v,i)=>`<span class=\"${i===G.turn?'act':''}\" style=\"--c:${TC[i]}\">${esc(s.teams[i])}: ${v}<\/span>`).join(''):`<span>\u2b50 ${G.sc[0]}<\/span><span>\ud83d\udd25 Streak ${G.streak}<\/span><span>\u2705 ${G.ok}/${G.tot}<\/span>`;\n}\nconst banner=()=>D.settings.mode==='team'?`<div class=\"turn\" id=\"tn\" style=\"--c:${TC[G.turn]}\">\ud83d\udc49 ${esc(D.settings.teams[G.turn])}, it's your turn!<\/div>`:'';\nfunction passTurn(){\n if(D.settings.mode!=='team')return;G.turn=(G.turn+1)%G.sc.length;\n const t=$('#tn');if(t){t.style.setProperty('--c',TC[G.turn]);t.textContent=\"\ud83d\udc49 \"+D.settings.teams[G.turn]+\", it's your turn!\"}\n}\nfunction showQ(){\n if(G.i>=G.pool.length){G.pool=shuffle(G.pool);G.i=0}\n const q=G.pool[G.i++];G.q=q;G.lock=false;\n if(q.seq){\n  G.next=0;const so=shuffle(q.s.map((t,i)=>i));\n  $('#qa').innerHTML=`${banner()}<div class=\"qc\">\ud83d\udd22 ${esc(q.q)}<small>Tap the steps in the correct order!<\/small><\/div><div class=\"steps\">${so.map(k=>`<button class=\"stp\" data-act=\"stp\" data-k=\"${k}\">${esc(q.s[k])}<\/button>`).join('')}<\/div><div class=\"fb\" id=\"fb\"><\/div>`;\n }else{\n  let o=q.o.map((t,i)=>({t,c:i===q.a}));if(!q.fixed)o=shuffle(o);G.o=o;\n  $('#qa').innerHTML=`${banner()}<div class=\"qc\">${esc(q.q)}<\/div><div class=\"opts ${o.length===2?'':'four'}\">${o.map((x,i)=>`<button class=\"opt\" data-act=\"ans\" data-i=\"${i}\"><span>${'ABCD'[i]}<\/span>${esc(x.t)}<\/button>`).join('')}<\/div><div class=\"fb\" id=\"fb\"><\/div>`;\n }\n scoreBar();\n}\nfunction ans(i){\n if(!G||G.lock||G.over||G.q.seq)return;G.lock=true;\n const ok=G.o[i].c,solo=D.settings.mode!=='team',bs=[...document.querySelectorAll('.opt')];\n bs.forEach((b,k)=>{b.disabled=true;if(G.o[k].c)b.classList.add('good')});G.tot++;\n if(ok){const pts=10+(solo&&G.streak>=2?5:0);G.ok++;G.streak++;G.sc[G.turn]+=pts;$('#fb').textContent='\u2705 Correct! +'+pts;$('#fb').style.color='#16a34a';beep(880)}\n else{bs[i].classList.add('bad');G.streak=0;$('#fb').textContent='\u274c Not quite \u2014 the answer is '+G.o.find(x=>x.c).t;$('#fb').style.color='#dc2626';beep(200,.25)}\n scoreBar();\n setTimeout(()=>{if(!G||G.over)return;passTurnIf(ok);showQ()},ok?900:1700);\n}\nfunction passTurnIf(ok){if(D.settings.mode==='team')G.turn=(G.turn+1)%G.sc.length}\nfunction stp(k,b){\n if(!G||G.over||G.lock||!G.q.seq)return;G.tot++;\n if(k===G.next){\n  b.classList.add('good');b.disabled=true;b.insertAdjacentHTML('afterbegin',`<span class=\"n\">${k+1}<\/span>`);\n  G.next++;G.ok++;G.sc[G.turn]+=5;beep(700+G.next*40,.07);\n  if(G.next===G.q.s.length){G.lock=true;G.sc[G.turn]+=10;G.streak++;$('#fb').textContent='\ud83c\udf89 Perfect order! +10 bonus';$('#fb').style.color='#16a34a';beep(990,.25);scoreBar();setTimeout(()=>{if(!G||G.over)return;passTurnIf(1);showQ()},1300)}\n }else{\n  b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400);G.streak=0;beep(200,.2);\n  $('#fb').textContent='\u274c Not yet! Try another step'+(D.settings.mode==='team'?' \u2014 turn passes':'');$('#fb').style.color='#dc2626';passTurn();\n }\n scoreBar();\n}\nfunction endGame(){\n stop();G.over=true;beep(660,.35);\n const s=D.settings,team=s.mode==='team';let body;\n if(team){\n  const r=G.sc.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),top=r[0].v,w=r.filter(x=>x.v===top);\n  body=`<div class=\"big\">\ud83c\udfc6<\/div><h1>${w.length>1?\"It's a tie!\":esc(s.teams[w[0].i])+' wins!'}<\/h1>`+r.map((x,k)=>`<div class=\"rank ${x.v===top?'win':''}\" style=\"--c:${TC[x.i]}\">${['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49','4\ufe0f\u20e3'][k]} ${esc(s.teams[x.i])}<em>${x.v} pts<\/em><\/div>`).join('')+`<p class=\"hint\">${G.ok} correct out of ${G.tot} answers<\/p>`;\n }else{\n  const acc=G.tot?Math.round(G.ok/G.tot*100):0;\n  body=`<div class=\"big\">${acc>=80?'\ud83c\udf1f':acc>=50?'\ud83d\udc4d':'\ud83d\udcaa'}<\/div><h1>Time's up!<\/h1><div class=\"big\" style=\"color:#ea580c\">${G.sc[0]} pts<\/div><p><b>${G.ok}<\/b> correct out of <b>${G.tot}<\/b> (${acc}%)<\/p><p class=\"hint\">${acc>=80?'Outstanding chef & tech whiz!':acc>=50?'Great effort \u2014 try again to beat your score!':'Keep practicing \u2014 you can do it!'}<\/p>`;\n }\n app.innerHTML=`<div class=\"res panel\">${body}<div class=\"acts\"><button class=\"btn pri\" data-act=\"again\">\ud83d\udd01 Play Again<\/button><button class=\"btn\" data-act=\"home\">\ud83c\udfe0 Home<\/button><\/div><\/div>`;\n}\n\n/* ---------- EDITOR ---------- */\nfunction editor(){\n const y=scrollY,d=D.decks[E.d],seq=d.type==='seq';\n const rows=seq?d.qs.map((q,qi)=>`<div class=\"qe\"><div class=\"qh\"><input type=\"text\" data-f=\"q\" data-qi=\"${qi}\" value=\"${esc(q.q)}\" aria-label=\"Puzzle title\"><button class=\"x\" data-act=\"delq\" data-qi=\"${qi}\">\ud83d\uddd1<\/button><\/div>\n <p class=\"hint\" style=\"margin:2px 0 6px\">Steps in the CORRECT order (players will see them shuffled):<\/p>\n ${q.s.map((t,si)=>`<div class=\"oe\"><b>${si+1}.<\/b><input type=\"text\" data-f=\"s\" data-qi=\"${qi}\" data-oi=\"${si}\" value=\"${esc(t)}\">${q.s.length>2?`<button class=\"x\" data-act=\"dels\" data-qi=\"${qi}\" data-oi=\"${si}\">\u2715<\/button>`:''}<\/div>`).join('')}\n <button class=\"btn sm\" data-act=\"adds\" data-qi=\"${qi}\">\uff0b step<\/button><\/div>`).join('')\n :d.qs.map((q,qi)=>`<div class=\"qe\"><div class=\"qh\"><b>Question ${qi+1}<\/b><button class=\"x\" data-act=\"delq\" data-qi=\"${qi}\">\ud83d\uddd1 Delete<\/button><\/div><textarea rows=\"2\" data-f=\"q\" data-qi=\"${qi}\">${esc(q.q)}<\/textarea>\n ${q.o.map((o,oi)=>`<div class=\"oe\"><input type=\"radio\" name=\"r${qi}\" data-f=\"a\" data-qi=\"${qi}\" data-oi=\"${oi}\" ${q.a===oi?'checked':''}><input type=\"text\" data-f=\"o\" data-qi=\"${qi}\" data-oi=\"${oi}\" value=\"${esc(o)}\">${q.o.length>2?`<button class=\"x\" data-act=\"delopt\" data-qi=\"${qi}\" data-oi=\"
